<!doctype html>
<html>
<head>
	<title>Jukie</title>
	<meta name="viewport" content="width=device-width initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body style="background:#000;">

<script type="text/javascript">
	// Framework-less device switcher: this package bundles both a Mojo (webOS 2.x)
	// and an Enyo (webOS 3.x) build of Jukie under one app id, since a webOS package
	// can only declare one "app" entry (confirmed against the packageinfo.json
	// schema) - this bootstrap is that one entry, and it just picks which real one
	// to load. Modeled directly on a real shipped app that does the same thing:
	// dev-stuff/com.preciouscoders.pre.auctionmatepro/index.html.
	(function () {
		var loc = window.location.href;
		var path = loc.substr(0, loc.lastIndexOf("/") + 1);
		var target = "enyo/index.html"; // default - Enyo/webOS3 is the long-proven build;
		                                 // fall through to it if detection is unavailable
		                                 // or ambiguous, same failure-mode choice the
		                                 // reference app makes.

		if (window.PalmSystem) {
			try {
				var deviceInfo = JSON.parse(PalmSystem.deviceInfo);
				if (deviceInfo["platformVersionMajor"] < 3) {
					target = "mojo/index.html";
				}
			} catch (e) {
				// malformed/unexpected deviceInfo - keep the Enyo default
			}
		}

		window.location.replace(path + target);
	})();
</script>

</body>
</html>
